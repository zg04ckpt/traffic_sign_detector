apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  name: rabbitmq
  namespace: server5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: server5-rabbitmq-secret
        image: rabbitmq:3-management
        name: rabbitmq
        ports:
        - containerPort: 5672
        - containerPort: 15672
