apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  name: api-gateway
  namespace: server5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: server5-common-config
        image: server5/api-gateway:local
        imagePullPolicy: IfNotPresent
        name: api-gateway
        ports:
        - containerPort: 8081
