apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: server5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: server5-db-secret
        image: postgres:16
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        - mountPath: /docker-entrypoint-initdb.d
          name: postgres-init
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: server5-postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-databases
